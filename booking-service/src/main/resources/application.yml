server:
  port: ${BOOKING_SERVER_PORT:8002}
  address: 0.0.0.0
  servlet:
    context-path: /booking-service
spring:
  task:
    scheduling:
      # O padrão do Boot é uma thread. O relay, a expiração de PENDING e os expurgos
      # dividiriam essa thread: um backlog segura os outros. Três deixam o relay e a
      # expiração andarem juntos; o expurgo horário usa a que sobra.
      pool:
        size: 3
  application:
    name: '@name@'
    version: '@revision@'
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
    # O `AbstractRabbitPublisher` espera o confirm de cada envio e trata o return como falha.
    # Sem estas chaves o broker descarta em silêncio o evento que não encontra fila.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # Sem isto uma rejeição devolve a mensagem ao início da fila em vez de levá-la à DLQ.
        default-requeue-rejected: false
        # Convenção do projeto: todo listener consome com no mínimo 3 threads. É o mínimo (o
        # Boot chama de `concurrency`), e sem a chave o Spring AMQP usa 1 consumidor por fila.
        # Com vários consumidores a ordem de processamento da fila deixa de ser garantida.
        concurrency: 3
        retry:
          enabled: true
          # Retentativas depois da primeira: 2 são 3 tentativas ao todo. O Boot 4 não tem mais
          # `max-attempts` e ignora em silêncio uma chave que não conhece.
          max-retries: 2
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
  datasource:
    driver-class-name: org.postgresql.Driver
    # O `currentSchema` existe porque nem tudo passa pelo `default_schema` do Hibernate: uma
    # consulta nativa resolve o nome da tabela pelo `search_path` da conexão. Só o schema do
    # serviço entra no caminho — é o único que este usuário enxerga.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:hotel_booking_system}?currentSchema=${BOOKING_DB_SCHEMA:booking}
    # As coordenadas do banco são compartilhadas; a identidade, não. Cada serviço conecta com
    # o próprio usuário, e é isso que o impede de ler o schema dos outros.
    username: ${BOOKING_DB_USERNAME:user_booking_service}
    password: ${BOOKING_DB_PASSWORD:password}
  flyway:
    # Os três serviços com banco dividem uma instância só e se separam por schema. As
    # coordenadas de conexão continuam vindo do `DataSource`; o que o Flyway não tem como
    # deduzir é onde criar as tabelas.
    schemas: ${BOOKING_DB_SCHEMA:booking}
    create-schemas: true
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Sem isto o validador do `ddl-auto` procura a tabela sem qualificar o schema, e
        # `room` existe tanto em `hotel` quanto em `booking` dentro do mesmo banco.
        default_schema: ${BOOKING_DB_SCHEMA:booking}
        format_sql: true
  docker:
    compose:
      file: '.\docker\common.yml'
      enabled: ${ENABLE_BUILTIN_DOCKER_COMPOSE:false}
# Só `health` e `info` saem pela web. O `include: "*"` anterior entregava `/actuator/env`
# (variáveis de ambiente, com as senhas do banco e do RabbitMQ), `configprops`, `beans` e
# `mappings` a quem alcançasse a porta, e não há Spring Security para barrar. Liberar outro
# endpoint é uma decisão: o `ActuatorExposureConfigTest` falha até ser atualizado junto.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # `never` já é o default; fica explícito para a intenção não depender da versão do Boot.
      show-details: never

app:
  booking:
    # Espera máxima pelo lock do quarto, por tentativa de entrega. O pior caso até a DLQ é
    # cerca de três vezes este limite mais o backoff do retry (1 s, depois 2 s).
    room-lock-timeout: 10s
  rabbitmq:
    # Espalha cada espera do retry em até +-500ms (multiplicado a cada tentativa). O Boot 4.1 não
    # tem chave de jitter em spring.rabbitmq.listener.simple.retry; quem lê esta é o commons.
    retry:
      jitter: 500ms
    exchange:
      booking-room: exchange.booking-room
    routing-key:
      booking-room-requested: routing-key.booking-room-requested
      booking-room-confirmation: routing-key.booking-room-confirmation
      booking-room-status-changed: routing-key.booking-room-status-changed
    queue:
      booking-room-requested: booking-room-requested
      booking-room-confirmation: booking-room-confirmation
      booking-room-status-changed: booking-room-status-changed
  # O relay publica o que a transação de negócio gravou. O intervalo curto encurta a espera da
  # saga. A linha publicada não é lida por ninguém: a deduplicação mora no processed_event.
  # Um dia cobre uma investigação; mais do que isso só aumenta o claim.
  outbox:
    relay-interval: PT1S
    round-budget: PT5S
    retention: P1D
    purge-interval: PT1H
