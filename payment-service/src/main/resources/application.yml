server:
  port: ${PAYMENT_SERVER_PORT:8003}
  address: 0.0.0.0
  servlet:
    context-path: /payment-service
spring:
  application:
    name: '@name@'
    version: '@revision@'
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
    listener:
      simple:
        # Sem isto uma rejeição devolve a mensagem ao início da fila em vez de levá-la à DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          # Retentativas depois da primeira: 2 são 3 tentativas ao todo. O Boot 4 não tem mais
          # `max-attempts` e ignora em silêncio uma chave que não conhece.
          max-retries: 2
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
    # O `AbstractRabbitPublisher` espera o confirm de cada envio e trata o return como falha.
    # Sem estas chaves o broker descarta em silêncio o evento que não encontra fila.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  docker:
    compose:
      file: '.\docker\common.yml'
      enabled: ${ENABLE_BUILTIN_DOCKER_COMPOSE:false}
# Só `health` e `info` saem pela web. O `include: "*"` anterior entregava `/actuator/env`
# (variáveis de ambiente, com as senhas do banco e do RabbitMQ), `configprops`, `beans` e
# `mappings` a quem alcançasse a porta, e não há Spring Security para barrar. Liberar outro
# endpoint é uma decisão: o `ActuatorExposureConfigTest` falha até ser atualizado junto.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # `never` já é o default; fica explícito para a intenção não depender da versão do Boot.
      show-details: never

app:
  payment:
    mock:
      failure-chance-percentage: ${FAILURE_CHANCE_PERCENTAGE:90}
  rabbitmq:
    exchange:
      payment: exchange.payment
    routing-key:
      payment-request: routing-key.payment-request
      payment-confirmation: routing-key.payment-confirmation
    queue:
      payment-request: payment-request
      payment-confirmation: payment-confirmation


