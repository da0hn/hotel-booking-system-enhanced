version: '3.8'

services:
  hotel-service:
    image: com.hotel.booking.system/hotel-service:latest
    container_name: hotel-service
    restart: on-failure
    build:
      context: ../
      dockerfile: ./Dockerfile
      args:
        MODULE: hotel-service
    environment:
      HOTEL_SERVER_PORT: 8001
      DB_HOST: hotel-booking-system-db
      DB_PORT: 5432
      DB_NAME: hotel_booking_system
      DB_USERNAME: user
      DB_PASSWORD: password
      HOTEL_DB_SCHEMA: hotel
      ENABLE_BUILTIN_DOCKER_COMPOSE: false
      RABBITMQ_HOST: hotel-booking-system-queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: root
      RABBITMQ_PASSWORD: root
    ports:
      - '8001:8001'
    networks:
      - hotel-booking-system-network

  booking-service:
    image: com.hotel.booking.system/booking-service:latest
    container_name: booking-service
    restart: on-failure
    build:
      context: ../
      dockerfile: ./Dockerfile
      args:
        MODULE: booking-service
    environment:
      BOOKING_SERVER_PORT: 8002
      DB_HOST: hotel-booking-system-db
      DB_PORT: 5432
      DB_NAME: hotel_booking_system
      DB_USERNAME: user
      DB_PASSWORD: password
      BOOKING_DB_SCHEMA: booking
      ENABLE_BUILTIN_DOCKER_COMPOSE: false
      RABBITMQ_HOST: hotel-booking-system-queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: root
      RABBITMQ_PASSWORD: root
    ports:
      - '8002:8002'
    networks:
      - hotel-booking-system-network

  payment-service:
    image: com.hotel.booking.system/payment-service:latest
    container_name: payment-service
    restart: on-failure
    build:
      context: ../
      dockerfile: ./Dockerfile
      args:
        MODULE: payment-service
    environment:
      PAYMENT_SERVER_PORT: 8003
      ENABLE_BUILTIN_DOCKER_COMPOSE: false
      RABBITMQ_HOST: hotel-booking-system-queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: root
      RABBITMQ_PASSWORD: root
      FAILURE_CHANCE_PERCENTAGE: 50
    ports:
      - '8003:8003'
    networks:
      - hotel-booking-system-network

  customer-service:
    image: com.hotel.booking.system/customer-service:latest
    container_name: customer-service
    restart: on-failure
    build:
      context: ../
      dockerfile: ./Dockerfile
      args:
        MODULE: customer-service
    environment:
      CUSTOMER_SERVER_PORT: 8004
      DB_HOST: hotel-booking-system-db
      DB_PORT: 5432
      DB_NAME: hotel_booking_system
      DB_USERNAME: user
      DB_PASSWORD: password
      CUSTOMER_DB_SCHEMA: customer
      ENABLE_BUILTIN_DOCKER_COMPOSE: false
      RABBITMQ_HOST: hotel-booking-system-queue
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: root
      RABBITMQ_PASSWORD: root
    ports:
      - '8004:8004'
    networks:
      - hotel-booking-system-network
networks:
  hotel-booking-system-network:
    driver: bridge
    name: hotel-booking-system-network
