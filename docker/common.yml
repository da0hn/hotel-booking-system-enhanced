version: '3.8'
name: hotel-booking-system-infrastructure
services:
  # Um container só, um banco só, um schema por serviço. O desenho anterior — três instâncias
  # de MySQL — não cabe no homelab, e a separação por schema entrega o mesmo isolamento de
  # nomes sem multiplicar processos. Cada serviço cria e migra o seu schema pelo Flyway.
  hotel-booking-system-db:
    image: 'postgres:17-alpine'
    container_name: hotel-booking-system-db
    environment:
      TZ: America/Cuiaba
      POSTGRES_DB: hotel_booking_system
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    stdin_open: true
    tty: true
    restart: on-failure
    # Publicado em 5442, e não em 5432, pela mesma razão que os containers de MySQL usavam
    # 3311/3312/3313: a porta default costuma já estar ocupada por outro banco na máquina de
    # quem desenvolve. Dentro da rede do compose a porta continua sendo a 5432.
    ports:
      - '5442:5432'
    volumes:
      # O entrypoint do postgres só executa isto no primeiro start, com o volume vazio. Num
      # volume que já tem dado, os papéis precisam ser criados à mão.
      - ./scripts/01-create-service-roles.sql:/docker-entrypoint-initdb.d/01-create-service-roles.sql
      - hotel-booking-system-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U user -d hotel_booking_system' ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hotel-booking-system-network

  hotel-booking-system-queue:
    image: rabbitmq:3-management
    container_name: hotel-booking-system-queue
    hostname: hotel-booking-system-queue
    restart: on-failure
    ports:
      - '5672:5672'
      - '25676:25676'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: root
    networks:
      - hotel-booking-system-network

networks:
  hotel-booking-system-network:
    driver: bridge
    name: hotel-booking-system-network
volumes:
  hotel-booking-system-db-volume:
    name: hotel-booking-system-db-volume
    external: true
