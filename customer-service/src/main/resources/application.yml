server:
  port: ${CUSTOMER_SERVER_PORT:8004}
  address: 0.0.0.0
  servlet:
    context-path: /customer-service
spring:
  application:
    name: '@name@'
    version: '@revision@'
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
    listener:
      simple:
        # Sem isto uma rejeição devolve a mensagem ao início da fila em vez de levá-la à DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          # Retentativas depois da primeira: 2 são 3 tentativas ao todo. O Boot 4 não tem mais
          # `max-attempts` e ignora em silêncio uma chave que não conhece.
          max-retries: 2
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
  datasource:
    driver-class-name: org.postgresql.Driver
    # O `currentSchema` existe porque nem tudo passa pelo `default_schema` do Hibernate: uma
    # consulta nativa resolve o nome da tabela pelo `search_path` da conexão. Só o schema do
    # serviço entra no caminho — é o único que este usuário enxerga.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:hotel_booking_system}?currentSchema=${CUSTOMER_DB_SCHEMA:customer}
    # As coordenadas do banco são compartilhadas; a identidade, não. Cada serviço conecta com
    # o próprio usuário, e é isso que o impede de ler o schema dos outros.
    username: ${CUSTOMER_DB_USERNAME:user_customer_service}
    password: ${CUSTOMER_DB_PASSWORD:password}
  flyway:
    # Os três serviços com banco dividem uma instância só e se separam por schema. As
    # coordenadas de conexão continuam vindo do `DataSource`; o que o Flyway não tem como
    # deduzir é onde criar as tabelas.
    schemas: ${CUSTOMER_DB_SCHEMA:customer}
    create-schemas: true
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Sem isto o validador do `ddl-auto` procura a tabela sem qualificar o schema, e
        # `room` existe tanto em `hotel` quanto em `booking` dentro do mesmo banco.
        default_schema: ${CUSTOMER_DB_SCHEMA:customer}
        format_sql: true
  docker:
    compose:
      file: '.\docker\common.yml'
      enabled: ${ENABLE_BUILTIN_DOCKER_COMPOSE:false}
# Só `health` e `info` saem pela web. O `include: "*"` anterior entregava `/actuator/env`
# (variáveis de ambiente, com as senhas do banco e do RabbitMQ), `configprops`, `beans` e
# `mappings` a quem alcançasse a porta, e não há Spring Security para barrar. Liberar outro
# endpoint é uma decisão: o `ActuatorExposureConfigTest` falha até ser atualizado junto.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # `never` já é o default; fica explícito para a intenção não depender da versão do Boot.
      show-details: never

app:
  rabbitmq:
    exchange:
      customer-booking: exchange.customer-booking
    routing-key:
      customer-booking-update: routing-key.customer-booking-update
    queue:
      customer-booking-update: customer-booking-update

