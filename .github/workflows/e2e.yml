# Os testes ponta a ponta, fora do caminho crítico do `build.yml`.
#
# Eles sobem PostgreSQL, RabbitMQ e os quatro serviços como processos. Por
# decisão do mantenedor, o módulo deles (`e2e-tests`) só entra no Maven com o
# profile `e2e`, então o `mvn verify` do `build.yml` não o enxerga. Este workflow
# é o outro caminho: roda quando alguém pede. No CI o `SagaIT`, o primeiro deles,
# levou ~1,5 min (out/2026).
#
# Dois gatilhos, e cada um cobre o que o outro não alcança:
#
#   label `e2e` num PR    ->  roda a partir do branch do PR. É o gatilho que
#                             funciona antes de este arquivo chegar à `master`.
#   workflow_dispatch     ->  botão "Run workflow" e `gh workflow run e2e.yml`.
#                             O GitHub só lista o botão para workflows que já
#                             estão na branch padrão, ou seja, depois da
#                             primeira release que o contenha.
#
# Quem mexe no contrato de eventos, na fronteira transacional ou na regra de
# disponibilidade deve pedir esta prova antes de mesclar na `develop`: um
# evento movido de pacote deixa os quatro serviços saudáveis e a saga parada,
# e nenhum outro teste enxerga isso.
name: e2e

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

# Rotular de novo, ou disparar de novo, substitui a execução em andamento: o
# que importa é o veredito do último pedido.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'

jobs:

  e2e-gate:
    name: Verificar se a issue pede E2E
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decision.outputs.run }}
    steps:
      - name: Detectar o rótulo e2e na PR ou em issue referenciada
        id: decision
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run', 'true');
              return;
            }

            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setOutput('run', 'false');
              return;
            }

            const directlyLabeled = context.payload.label?.name === 'e2e'
              || pullRequest.labels?.some(label => label.name === 'e2e');
            if (directlyLabeled) {
              core.info('A PR recebeu o rótulo e2e.');
              core.setOutput('run', 'true');
              return;
            }

            const references = new Set();
            const referenceText = [pullRequest.head.ref, pullRequest.title, pullRequest.body || ''].join('\n');
            for (const match of referenceText.matchAll(/\bGH[-_](\d+)\b/gi)) {
              references.add(Number(match[1]));
            }
            for (const match of (pullRequest.body || '').matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*#(\d+)\b/gi)) {
              references.add(Number(match[1]));
            }

            for (const issueNumber of references) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                }));
              } catch (error) {
                if (error.status === 404) {
                  core.warning('Issue #' + issueNumber + ' referenciada pela PR não foi encontrada.');
                  continue;
                }
                throw error;
              }

              if (issue.labels.some(label => label.name === 'e2e')) {
                core.info('A issue #' + issueNumber + ' possui o rótulo e2e.');
                core.setOutput('run', 'true');
                return;
              }
            }

            core.info('Nenhuma issue referenciada possui o rótulo e2e.');
            core.setOutput('run', 'false');

  e2e:
    name: Testes ponta a ponta
    needs: e2e-gate
    if: needs.e2e-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # `-am` constrói os quatro serviços e o `commons` antes do teste, porque os
      # testes executam os jars empacotados. `-Dtest=NoSuchTest` e `-Dit.test`
      # deixam de fora os testes dos outros módulos: o `provas` do `build.yml`
      # já os rodou, e repeti-los aqui só gastaria o tempo que este workflow
      # existe para poupar. O `-Dit.test` casa o pacote do módulo, então um
      # teste novo em `e2e-tests` entra sem mexer neste arquivo.
      - name: Rodar os testes ponta a ponta
        run: >
          mvn -B verify -Pe2e -pl e2e-tests -am
          -Dtest=NoSuchTest -Dit.test='com.hotel.booking.system.e2e.**'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dfailsafe.failIfNoSpecifiedTests=false

      # O `failIfNoSpecifiedTests=false` é necessário nos outros módulos, onde o
      # filtro não casa com nada, mas também deixaria passar um filtro que não
      # casa com nada no próprio `e2e-tests`: verde sem ter rodado teste algum.
      - name: Conferir que os testes ponta a ponta rodaram
        run: test -n "$(ls e2e-tests/target/failsafe-reports/TEST-*.xml 2>/dev/null)"

      # Os serviços são processos filhos, então o que explica uma falha está no
      # log de cada um, e não no relatório do failsafe. A mensagem do teste traz
      # só a cauda; o arquivo inteiro fica aqui.
      - name: Anexar os logs dos serviços
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e-tests/target/e2e-logs/
            e2e-tests/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
