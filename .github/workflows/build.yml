# Build, provas e imagens dos quatro serviços.
#
# As imagens vão para o GHCR e é de lá que o homelab as puxa. Nenhum
# manifesto de deploy vive neste repositório: quem aponta o cluster para a
# imagem nova é o homelab, observando o registry. Por isso aqui não existe
# credencial de escrita em outro repositório — só o `GITHUB_TOKEN` efêmero do
# próprio job.
#
# O repositório segue uma variação de gitflow, e este workflow é a metade
# automatizada dela:
#
#   feature/*            PR   ->  build e testes, nada publicado
#   develop              push ->  build e testes, nada publicado
#   release/X.Y.Z        push ->  bump do pom + X.Y.Z-RC.<build> e X.Y.Z-RC-latest
#   hotfix/X.Y.Z         push ->  idem, a partir da master
#   master               push ->  X.Y.Z-<build> e X.Y.Z-latest
#
# O desenho completo, com os cortes de branch e os pontos de publicação, está
# em `docs/diagrams/06-gitflow-pipeline.jpg`.
name: build

on:
  push:
    branches: [master, develop, 'release/**', 'hotfix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Dois pushes seguidos na mesma branch publicariam duas versões em paralelo, e
# a ordem de chegada ao GHCR deixaria de ser a ordem dos commits. Num push a
# execução anterior termina; num Pull Request ela é cancelada, porque ali o
# que importa é o veredito do último push.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # O `Dockerfile` recebe este mesmo valor por `build-arg`, para que a base
  # declarada no label OCI e a base real nunca divirjam. Trocar aqui sem
  # trocar o default do `ARG JAVA_VERSION` do `Dockerfile` faria o build local
  # e o do CI usarem JDKs diferentes sem ninguém perceber.
  JAVA_VERSION: '25'

jobs:

  contexto:
    name: Versão e canal de publicação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A escrita existe por um motivo só: o bump do `<revision>` numa branch de
    # release ou de hotfix. Nenhum outro job deste workflow escreve no repo.
    permissions:
      contents: write
    outputs:
      versao: ${{ steps.decidir.outputs.versao }}
      canal: ${{ steps.decidir.outputs.canal }}
      sha: ${{ steps.decidir.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Aqui se decide tudo o que os jobs seguintes precisam saber: qual é a
      # versão, se ela vai ao registry e sob qual canal, e qual commit carrega
      # o código a ser empacotado.
      #
      # A versão de uma release NÃO é lida do pom: ela é lida do nome da
      # branch, e o pom é ajustado para segui-la. O nome é a declaração de
      # intenção de quem cortou a release; o pom é uma consequência. Fosse o
      # contrário, `release/1.4.0` poderia publicar `1.3.0` sem que nada
      # reclamasse.
      - name: Decidir versão, canal e commit
        id: decidir
        run: |
          set -euo pipefail

          evento='${{ github.event_name }}'
          ref='${{ github.ref }}'
          sha='${{ github.sha }}'

          # O sufixo `-SNAPSHOT` sai porque tag OCI nomeia artefato publicado,
          # e não candidato local.
          versao_do_pom() {
            local v
            v="$(grep -m1 -oP '(?<=<revision>)[^<]+' pom.xml)"
            printf '%s' "${v%-SNAPSHOT}"
          }

          case "${evento}:${ref}" in
            push:refs/heads/release/*|push:refs/heads/hotfix/*)
              alvo="${ref#refs/heads/}"   # release/1.4.0
              alvo="${alvo#*/}"           # 1.4.0
              canal='rc'
              ;;
            push:refs/heads/master)
              # Na master a versão já veio pronta: é o bump que a release
              # commitou e que o merge trouxe junto.
              alvo="$(versao_do_pom)"
              canal='final'
              ;;
            *)
              alvo="$(versao_do_pom)"
              canal='nenhum'
              ;;
          esac

          if [ "$canal" = 'rc' ] \
            && ! printf '%s' "$alvo" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Branch '${ref#refs/heads/}' não nomeia uma versão." \
                 "O formato exigido é release/X.Y.Z ou hotfix/X.Y.Z."
            exit 1
          fi

          # O bump é commitado na própria branch de release, e não passado por
          # `-Drevision=`: quem abre o repositório na tag precisa ver a versão
          # que foi publicada, sem ter que reconstruir o argumento da linha de
          # comando do CI.
          #
          # Este push não redispara o workflow: o GitHub ignora eventos
          # gerados pelo `GITHUB_TOKEN` do próprio job. É o que impede o loop
          # infinito — e é também por isso que a imagem tem de ser construída
          # nesta mesma execução, já que não haverá uma segunda.
          if [ "$canal" = 'rc' ] && [ "$(versao_do_pom)" != "$alvo" ]; then
            echo "Bump: $(versao_do_pom) -> ${alvo}"

            sed -i "0,/<revision>[^<]*<\/revision>/s//<revision>${alvo}<\/revision>/" pom.xml

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pom.xml
            git commit -m "chore(release): bump da versão para ${alvo}"
            git push origin "HEAD:${{ github.ref_name }}"

            sha="$(git rev-parse HEAD)"
          fi

          {
            echo "versao=${alvo}"
            echo "canal=${canal}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

          echo "Versão ${alvo}, canal ${canal}, commit ${sha}."

  mudancas:
    name: Módulos alterados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modulos: ${{ steps.detectar.outputs.modulos }}
    steps:
      # O diff precisa do histórico, e o checkout raso não o tem.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `commons` não vira imagem: é biblioteca dos outros quatro, e por isso
      # aparece só como gatilho de reconstrução, nunca como item da matriz.
      - name: Detectar o que mudou
        id: detectar
        run: |
          set -euo pipefail

          # A base do diff muda com o contexto, e escolher errado aqui publica
          # a imagem errada.
          #
          # Numa release ou hotfix a base é a `master`, e não o push anterior.
          # O que a release entrega é tudo o que mudou desde a última produção;
          # comparar contra o push anterior publicaria só o serviço tocado no
          # último ajuste do RC e deixaria os outros para trás.
          case "${{ github.event_name }}:${{ github.ref }}" in
            push:refs/heads/release/*|push:refs/heads/hotfix/*)
              git fetch --quiet origin master
              base="$(git merge-base origin/master HEAD)"
              ;;
            pull_request)
              base='${{ github.event.pull_request.base.sha }}'
              ;;
            push)
              base='${{ github.event.before }}'
              ;;
            *)
              base=''
              ;;
          esac

          # Primeiro push de uma branch, force-push e `workflow_dispatch` não
          # têm base utilizável. Nesses casos constrói tudo: um diff contra
          # uma base inexistente devolveria a lista vazia, e o silêncio seria
          # lido como "nada mudou".
          if [ -z "$base" ] \
            || [ "$base" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo 'Sem base de comparação utilizável: constrói tudo.'
            alterados='TODOS'
          else
            alterados="$(git diff --name-only "$base" '${{ github.sha }}')"
            echo "Base: $base"
            echo "$alterados"
          fi

          # O bump da própria pipeline toca o pom agregador, que é arquivo
          # comum aos quatro serviços — sem este descarte, toda release
          # reconstruiria os quatro por causa de uma linha de versão que o CI
          # mesmo escreveu. Só o `<revision>` é perdoado: qualquer outra
          # alteração no pom raiz continua alcançando todo mundo.
          if [ "$alterados" != 'TODOS' ] \
            && printf '%s\n' "$alterados" | grep -qx 'pom\.xml'; then
            corpo="$(git diff "$base" '${{ github.sha }}' -- pom.xml \
              | grep -E '^[+-][^+-]' || true)"
            if [ -n "$corpo" ] && ! printf '%s\n' "$corpo" | grep -qv '<revision>'; then
              echo 'No pom raiz só mudou a <revision>: não conta como alteração comum.'
              alterados="$(printf '%s\n' "$alterados" | grep -vx 'pom\.xml' || true)"
            fi
          fi

          # Uma mudança no `commons`, no pom agregador, no `Dockerfile` ou
          # neste workflow alcança os quatro serviços: eles compilam a partir
          # dos mesmos arquivos, e o `commons` carrega o contrato de eventos
          # que os quatro desserializam.
          comum='^(pom\.xml|Dockerfile|\.dockerignore|commons/|\.github/workflows/build\.yml)'

          afeta() {
            [ "$alterados" = 'TODOS' ] && return 0
            printf '%s\n' "$alterados" | grep -qE "$1"
          }

          # A descrição distingue os artefatos para quem abre o pacote no GHCR
          # sem conhecer este repositório. O que ela carrega de mais
          # importante é qual serviço coordena a saga: o `hotel-service` é o
          # único ponto de decisão, e os outros três só reagem à própria fila.
          descrever() {
            case "$1" in
              hotel-service)    echo 'API de hotéis e quartos; coordenador da saga de reserva' ;;
              booking-service)  echo 'Dono da disponibilidade e das reservas por período' ;;
              payment-service)  echo 'Pagamento simulado; sem banco, falha por sorteio' ;;
              customer-service) echo 'Projeção read-model da reserva do cliente e sua timeline' ;;
            esac
          }

          itens=''
          juntar() {
            [ -n "$itens" ] && itens="${itens},"
            itens="${itens}{\"modulo\":\"$1\",\"descricao\":\"$(descrever "$1")\"}"
          }

          for modulo in hotel-service booking-service payment-service customer-service; do
            if afeta "${comum}|^${modulo}/"; then
              juntar "$modulo"
            fi
          done

          echo "modulos=[${itens}]" >> "$GITHUB_OUTPUT"
          echo "Matriz: [${itens}]"

  provas:
    name: Build e testes do reactor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # O checkout aqui é o do evento, e não o commit pós-bump: a única coisa
      # que o bump altera é a string do `<revision>`, que nenhum teste observa.
      # Em troca, este job não espera pelo `contexto` e roda em paralelo com
      # ele.
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # O reactor inteiro roda mesmo quando um só serviço muda, e isso é
      # deliberado: `commons` é dependência dos quatro, e provar só o módulo
      # tocado deixaria passar a quebra que ele causa nos outros três.
      - name: Verificar o reactor Maven
        run: mvn -B verify

  imagem:
    name: Publicar no GHCR
    needs: [contexto, mudancas, provas]
    # Três condições, e cada uma barra um caso real: Pull Request e push na
    # `develop` não publicam nada; a lista vazia acontece quando o commit
    # tocou só documentação, e aí não há imagem a publicar. Sem a segunda,
    # todo commit no `README` ou nos diagramas publicaria quatro tags novas de
    # conteúdo idêntico.
    if: >
      needs.contexto.outputs.canal != 'nenhum'
      && needs.mudancas.outputs.modulos != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        incluir: ${{ fromJSON(needs.mudancas.outputs.modulos) }}
    steps:
      # O commit vem do `contexto`, e não do evento: numa release ele é o
      # commit do bump, que o evento ainda não conhecia.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.contexto.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      # Credencial efêmera do próprio job. Nenhum Secret de longa duração
      # precisa existir neste repositório para publicar no GHCR.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cada publicação sai com duas tags, e elas respondem perguntas
      # diferentes.
      #
      # A imutável — `1.4.0-RC.87`, `1.4.0-88` — responde "qual imagem está
      # rodando no homelab quando um pagamento falha". O `github.run_number`
      # cresce a cada execução e nunca se repete; o commit exato fica em
      # `org.opencontainers.image.revision`. O número pula por imagem: se um
      # commit toca só `payment-service`, ele sobe para `-42` enquanto
      # `customer-service` fica em `-37`. É o comportamento desejado — nada
      # exige que as quatro imagens existam na mesma versão, já que cada
      # serviço sobe sozinho.
      #
      # A móvel — `1.4.0-RC-latest`, `1.4.0-latest` — responde "qual é a mais
      # recente daquela versão", e existe para que o homelab e quem homologa o
      # RC não precisem descobrir o número do build. Ela não substitui a
      # primeira: as duas apontam para o mesmo push, e é sempre a imutável que
      # se cita num diagnóstico.
      #
      # A data vem do COMMIT, e não do relógio do runner: um `created` com a
      # hora do build faz duas construções da mesma árvore produzirem digests
      # diferentes. `SOURCE_DATE_EPOCH` é lido pelo BuildKit, que normaliza
      # os timestamps das camadas a partir dele.
      #
      # O digest da base é resolvido agora e registrado como metadado. As tags
      # de base são móveis; o digest não é — `revision` diz qual código entrou
      # na imagem, mas não diz qual JRE entrou.
      - name: Resolver tags, data do commit e digest da base
        id: proveniencia
        run: |
          set -euo pipefail

          versao='${{ needs.contexto.outputs.versao }}'
          build='${{ github.run_number }}'
          imagem="ghcr.io/${{ github.repository }}/${{ matrix.incluir.modulo }}"

          case '${{ needs.contexto.outputs.canal }}' in
            rc)    fixa="${versao}-RC.${build}"; movel="${versao}-RC-latest" ;;
            final) fixa="${versao}-${build}";    movel="${versao}-latest" ;;
            *)     echo '::error::Canal de publicação indefinido.'; exit 1 ;;
          esac

          epoch="$(git log -1 --pretty=%ct)"
          base="eclipse-temurin:${JAVA_VERSION}-jre-alpine"

          {
            echo "fixa=${fixa}"
            echo "tags=${imagem}:${fixa},${imagem}:${movel}"
            echo "epoch=${epoch}"
            echo "criado=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%M:%SZ)"
            echo "base=${base}"
            echo "base_digest=$(
              docker buildx imagetools inspect "${base}" \
                --format '{{.Manifest.Digest}}'
            )"
          } >> "$GITHUB_OUTPUT"

          echo "Publicando ${imagem} como ${fixa} e ${movel}."

      - name: Construir e publicar
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.proveniencia.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            MODULE=${{ matrix.incluir.modulo }}
            JAVA_VERSION=${{ env.JAVA_VERSION }}
          push: true
          tags: ${{ steps.proveniencia.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.incluir.modulo }}
            org.opencontainers.image.description=${{ matrix.incluir.descricao }}
            org.opencontainers.image.revision=${{ needs.contexto.outputs.sha }}
            org.opencontainers.image.version=${{ steps.proveniencia.outputs.fixa }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.proveniencia.outputs.criado }}
            org.opencontainers.image.base.name=${{ steps.proveniencia.outputs.base }}
            org.opencontainers.image.base.digest=${{ steps.proveniencia.outputs.base_digest }}
          # O escopo por módulo evita que as quatro imagens disputem a mesma
          # entrada de cache: elas compartilham as camadas de dependência e do
          # `commons`, mas divergem na camada do próprio serviço.
          cache-from: type=gha,scope=${{ matrix.incluir.modulo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.incluir.modulo }}

  marco:
    name: Marcar a versão na master
    needs: [contexto, provas, imagem]
    # `always()` é obrigatório aqui: `imagem` é legitimamente `skipped` quando
    # o merge só tocou documentação, e sem isto o `needs` pularia este job
    # junto — a master ficaria sem a marca da versão que entrou em produção.
    # As duas provas que importam são conferidas à mão logo abaixo.
    if: >
      always()
      && needs.contexto.outputs.canal == 'final'
      && needs.provas.result == 'success'
      && (needs.imagem.result == 'success' || needs.imagem.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Sem as tags remotas não há como saber se esta versão já foi
          # marcada, e a criação falharia no push em vez de ser ignorada.
          fetch-tags: true

      # A tag nasce depois do build e da publicação, nunca antes: ela é o
      # registro de que aquela versão chegou inteira em produção, e marcar um
      # commit cuja imagem falhou apontaria para uma release que não existe no
      # registry.
      - name: Criar a tag da versão
        run: |
          set -euo pipefail

          versao='${{ needs.contexto.outputs.versao }}'
          sha='${{ needs.contexto.outputs.sha }}'

          # Push de documentação na master não muda o `<revision>`, e cai aqui
          # com uma versão que já foi marcada. Repetir a tag seria um erro de
          # push; ignorá-la é o comportamento correto, porque a versão em
          # produção continua sendo a mesma.
          if git rev-parse -q --verify "refs/tags/${versao}" >/dev/null; then
            echo "A versão ${versao} já está marcada em $(git rev-parse --short "${versao}^{commit}")."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Anotada, e não leve: a tag anotada carrega autor, data e mensagem
          # próprios, e é a única que `git describe` enxerga por padrão.
          git tag -a "$versao" -m "Versão ${versao} em produção" "$sha"
          git push origin "refs/tags/${versao}"

          echo "Marcado ${sha} como ${versao}."

  # O único check obrigatório é este. Um check que depende de matriz filtrada
  # NUNCA reporta status quando a matriz sai vazia, e o Pull Request travaria
  # para sempre esperando por ele. `if: always()` faz este job rodar mesmo
  # assim, e o `result` de cada dependência é conferido à mão — `needs`
  # sozinho pularia o job junto com o que falhou.
  porta:
    name: Porta do build
    needs: [contexto, mudancas, provas, imagem, marco]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o veredito de cada job
        run: |
          set -euo pipefail
          echo "contexto: ${{ needs.contexto.result }}"
          echo "mudancas: ${{ needs.mudancas.result }}"
          echo "provas:   ${{ needs.provas.result }}"
          echo "imagem:   ${{ needs.imagem.result }}"
          echo "marco:    ${{ needs.marco.result }}"

          for r in '${{ needs.contexto.result }}' \
                   '${{ needs.mudancas.result }}' \
                   '${{ needs.provas.result }}'; do
            [ "$r" = 'success' ] || { echo 'Prova obrigatória falhou.'; exit 1; }
          done

          # `skipped` é resultado legítimo para os dois: Pull Request e push na
          # `develop` não publicam nem marcam versão, e commit que só toca
          # documentação não tem imagem a publicar.
          case '${{ needs.imagem.result }}' in
            success|skipped) ;;
            *) echo 'A publicação da imagem falhou.'; exit 1 ;;
          esac

          case '${{ needs.marco.result }}' in
            success|skipped) ;;
            *) echo 'A marcação da versão falhou.'; exit 1 ;;
          esac
