server:
  port: ${HOTEL_SERVER_PORT:8001}
  address: 0.0.0.0
  servlet:
    context-path: /hotel-service
spring:
  application:
    name: '@name@'
    version: '@revision@'
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:root}
  datasource:
    driver-class-name: org.postgresql.Driver
    # O `currentSchema` existe porque nem tudo passa pelo `default_schema` do Hibernate: uma
    # consulta nativa resolve o nome da tabela pelo `search_path` da conexão. O `public` no
    # fim do caminho é o que enxerga a extensão `unaccent`.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5442}/${DB_NAME:hotel_booking_system}?currentSchema=${HOTEL_DB_SCHEMA:hotel},public
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
  flyway:
    # Os três serviços com banco dividem uma instância só e se separam por schema. As
    # coordenadas de conexão continuam vindo do `DataSource`; o que o Flyway não tem como
    # deduzir é onde criar as tabelas.
    schemas: ${HOTEL_DB_SCHEMA:hotel}
    create-schemas: true
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Sem isto o validador do `ddl-auto` procura a tabela sem qualificar o schema, e
        # `room` existe tanto em `hotel` quanto em `booking` dentro do mesmo banco.
        default_schema: ${HOTEL_DB_SCHEMA:hotel}
        enable_lazy_load_no_trans: true
        format_sql: true
  docker:
    compose:
      file: '.\docker\common.yml'
      enabled: ${ENABLE_BUILTIN_DOCKER_COMPOSE:false}
management:
  endpoints:
    web:
      exposure:
        include: "*"

app:
  rabbitmq:
    exchange:
      booking-room: exchange.booking-room
      payment: exchange.payment
      customer-booking: exchange.customer-booking
    routing-key:
      booking-room-requested: routing-key.booking-room-requested
      booking-room-confirmation: routing-key.booking-room-confirmation
      booking-room-status-changed: routing-key.booking-room-status-changed
      payment-request: routing-key.payment-request
      payment-confirmation: routing-key.payment-confirmation
      customer-booking-update: routing-key.customer-booking-update
    queue:
      booking-room-requested: booking-room-requested
      booking-room-confirmation: booking-room-confirmation
      booking-room-status-changed: booking-room-status-changed
      payment-request: payment-request
      payment-confirmation: payment-confirmation
      customer-booking-update: customer-booking-update


